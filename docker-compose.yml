services:

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: magazzino
      DB_USER: alberto
      DB_PASSWORD: password123
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magazzino
      MYSQL_USER: alberto
      MYSQL_PASSWORD: password123
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
